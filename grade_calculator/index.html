<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Grade Calculator</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <h1>Student Grade Calculator</h1>

            <label>Student Name:</label>
            <input type="text" id="name" placeholder="Enter name">

            <label>Kannada Marks:</label>
            <input type="number" id="m1" min="0" max="100">

            <label>English Marks:</label>
            <input type="number" id="m2" min="0" max="100">

            <label>Mathematics Marks:</label>
            <input type="number" id="m3" min="0" max="100">

            <button onclick="calculateGrade()">Calculate</button>

            <div class="result" id="resultBox">

            </div>
        </div>

        <script src="scripts.js"></script>
    </body>
</html>
